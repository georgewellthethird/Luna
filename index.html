
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project LUNA: Moon Landing Anomaly Database</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-dark: #0a0a0f;
            --bg-card: #12121a;
            --accent: #d4af37;
            --accent-red: #c41e3a;
            --text: #e0e0e0;
            --text-dim: #888;
            --border: #2a2a3a;
            --classified: #ff0000;
        }

        body {
            font-family: 'Courier New', monospace;
            background: var(--bg-dark);
            color: var(--text);
            line-height: 1.6;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                rgba(18, 16, 16, 0) 50%, 
                rgba(0, 0, 0, 0.25) 50%
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 999;
            opacity: 0.3;
        }

        .header {
            background: linear-gradient(180deg, #0f0f1a 0%, var(--bg-dark) 100%);
            border-bottom: 2px solid var(--accent);
            padding: 2rem 1rem;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .classified-stamp {
            position: absolute;
            top: 20px;
            right: 20px;
            border: 3px solid var(--classified);
            color: var(--classified);
            padding: 5px 15px;
            font-weight: bold;
            font-size: 1.2rem;
            transform: rotate(15deg);
            opacity: 0.7;
            text-transform: uppercase;
            letter-spacing: 3px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 0.3; }
        }

        h1 {
            font-size: 2.5rem;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 5px;
            margin-bottom: 0.5rem;
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
        }

        .subtitle {
            color: var(--text-dim);
            font-size: 0.9rem;
            letter-spacing: 2px;
        }

        .stats-bar {
            display: flex;
            justify-content: space-around;
            padding: 1rem;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
            flex-wrap: wrap;
            gap: 1rem;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 2rem;
            color: var(--accent);
            font-weight: bold;
        }

        .stat-label {
            font-size: 0.8rem;
            color: var(--text-dim);
            text-transform: uppercase;
        }

        .controls {
            padding: 2rem;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            align-items: center;
            justify-content: space-between;
        }

        .search-box {
            flex: 1;
            min-width: 300px;
            position: relative;
        }

        input[type="text"], select {
            width: 100%;
            padding: 12px;
            background: var(--bg-dark);
            border: 1px solid var(--border);
            color: var(--text);
            font-family: inherit;
            font-size: 0.9rem;
            transition: all 0.3s;
        }

        input[type="text"]:focus, select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.2);
        }

        .filter-group {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 24px;
            background: transparent;
            border: 1px solid var(--accent);
            color: var(--accent);
            cursor: pointer;
            font-family: inherit;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s;
            font-size: 0.8rem;
        }

        .btn:hover {
            background: var(--accent);
            color: var(--bg-dark);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
        }

        .btn.active {
            background: var(--accent);
            color: var(--bg-dark);
        }

        .btn.danger {
            border-color: var(--accent-red);
            color: var(--accent-red);
        }

        .btn.danger:hover {
            background: var(--accent-red);
            color: white;
        }

        .container {
            padding: 2rem;
            max-width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
            min-width: 1200px;
        }

        thead {
            background: var(--bg-card);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        th {
            padding: 1rem;
            text-align: left;
            color: var(--accent);
            border-bottom: 2px solid var(--accent);
            cursor: pointer;
            user-select: none;
            position: relative;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 1px;
        }

        th:hover {
            background: rgba(212, 175, 55, 0.1);
        }

        th.sortable::after {
            content: " ⇅";
            opacity: 0.5;
            font-size: 0.7rem;
        }

        td {
            padding: 1rem;
            border-bottom: 1px solid var(--border);
            vertical-align: top;
        }

        tr {
            transition: all 0.3s;
            cursor: pointer;
        }

        tbody tr:hover {
            background: rgba(212, 175, 55, 0.05);
        }

        .theory-id {
            color: var(--accent);
            font-weight: bold;
            font-family: monospace;
        }

        .category {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 3px;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: 1px solid;
        }

        .cat-technical { color: #4fc3f7; border-color: #4fc3f7; }
        .cat-photographic { color: #ff7043; border-color: #ff7043; }
        .cat-physical { color: #66bb6a; border-color: #66bb6a; }
        .cat-political { color: #ab47bc; border-color: #ab47bc; }
        .cat-environmental { color: #ffca28; border-color: #ffca28; }
        .cat-witness { color: #ef5350; border-color: #ef5350; }
        .cat-historical { color: #8d6e63; border-color: #8d6e63; }

        .severity {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 5px;
        }

        .sev-high { background: var(--accent-red); box-shadow: 0 0 10px var(--accent-red); }
        .sev-medium { background: #ff9800; box-shadow: 0 0 10px #ff9800; }
        .sev-low { background: #4caf50; }

        .claim-text {
            max-width: 400px;
            line-height: 1.4;
        }

        .evidence-tag {
            display: inline-block;
            padding: 2px 6px;
            background: rgba(212, 175, 55, 0.2);
            border: 1px solid var(--accent);
            font-size: 0.7rem;
            margin: 2px;
            border-radius: 2px;
        }

        .debunked {
            opacity: 0.6;
            text-decoration: line-through;
        }

        .expanded-row {
            display: none;
            background: rgba(0, 0, 0, 0.3);
        }

        .expanded-content {
            padding: 2rem;
            border-left: 3px solid var(--accent);
            margin: 1rem 0;
        }

        .detail-section {
            margin-bottom: 1.5rem;
        }

        .detail-label {
            color: var(--accent);
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 2px;
            margin-bottom: 0.5rem;
            display: block;
        }

        .detail-text {
            color: var(--text-dim);
            line-height: 1.6;
        }

        .sources {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            margin-top: 1rem;
        }

        .source-link {
            color: var(--accent);
            text-decoration: none;
            border-bottom: 1px dotted var(--accent);
            font-size: 0.8rem;
        }

        .redacted {
            background: #000;
            color: #000;
            padding: 0 5px;
            cursor: help;
            transition: all 0.3s;
        }

        .redacted:hover {
            background: transparent;
            color: var(--text);
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 1rem;
            padding: 2rem;
            align-items: center;
        }

        .page-info {
            color: var(--text-dim);
            font-size: 0.9rem;
        }

        @media (max-width: 768px) {
            h1 { font-size: 1.5rem; }
            .controls { padding: 1rem; }
            .search-box { min-width: 100%; }
            .container { padding: 0.5rem; }
            th, td { padding: 0.5rem; font-size: 0.8rem; }
            .claim-text { max-width: 200px; }
        }

        .loading {
            text-align: center;
            padding: 3rem;
            color: var(--accent);
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="classified-stamp">TOP SECRET</div>
        <h1>PROJECT LUNA</h1>
        <div class="subtitle">Apollo Anomaly Database // Confidential Research Archive</div>
    </div>

    <div class="stats-bar">
        <div class="stat-item">
            <div class="stat-value" id="totalTheories">147</div>
            <div class="stat-label">Total Theories</div>
        </div>
        <div class="stat-item">
            <div class="stat-value" id="technicalCount">42</div>
            <div class="stat-label">Technical</div>
        </div>
        <div class="stat-item">
            <div class="stat-value" id="photoCount">38</div>
            <div class="stat-label">Photographic</div>
        </div>
        <div class="stat-item">
            <div class="stat-value" id="highSeverity">23</div>
            <div class="stat-label">High Severity</div>
        </div>
        <div class="stat-item">
            <div class="stat-value">1969-1972</div>
            <div class="stat-label">Time Period</div>
        </div>
    </div>

    <div class="controls">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="SEARCH DATABASE... (e.g., 'shadows', 'radiation', 'flag')">
        </div>
        <div class="filter-group">
            <select id="categoryFilter">
                <option value="">ALL CATEGORIES</option>
                <option value="Technical">TECHNICAL</option>
                <option value="Photographic">PHOTOGRAPHIC</option>
                <option value="Physical">PHYSICAL</option>
                <option value="Political">POLITICAL</option>
                <option value="Environmental">ENVIRONMENTAL</option>
                <option value="Witness">WITNESS TESTIMONY</option>
                <option value="Historical">HISTORICAL</option>
            </select>
            <select id="severityFilter">
                <option value="">ALL SEVERITY</option>
                <option value="High">HIGH</option>
                <option value="Medium">MEDIUM</option>
                <option value="Low">LOW</option>
            </select>
            <button class="btn" onclick="exportCSV()">EXPORT CSV</button>
            <button class="btn danger" onclick="toggleDebunked()">TOGGLE DEBUNKED</button>
        </div>
    </div>

    <div class="container">
        <table id="theoryTable">
            <thead>
                <tr>
                    <th class="sortable" onclick="sortTable(0)">ID</th>
                    <th class="sortable" onclick="sortTable(1)">Category</th>
                    <th class="sortable" onclick="sortTable(2)">Severity</th>
                    <th>Conspiracy Claim</th>
                    <th>Primary Evidence</th>
                    <th>Counter-Evidence</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="tableBody">
            </tbody>
        </table>
    </div>

    <div class="pagination">
        <button class="btn" onclick="prevPage()">PREVIOUS</button>
        <span class="page-info">Page <span id="currentPage">1</span> of <span id="totalPages">8</span></span>
        <button class="btn" onclick="nextPage()">NEXT</button>
    </div>

    <script>
        const theories = [
            // PHOTOGRAPHIC ANOMALIES (1-40)
            {
                id: "LUNA-001",
                category: "Photographic",
                severity: "High",
                claim: "Crosshair reticles appear BEHIND objects in photos, suggesting post-production compositing",
                evidence: "AS11-40-5902, AS14-64-9089",
                counter: "Overexposure causing white objects to bleed over thin black lines",
                status: "Debunked",
                details: "Conspiracy theorists claim that crosshair reticles (Reseau plates) visible in Apollo photos appear to be obscured by foreground objects, indicating the photos were doctored. NASA states this is due to overexposure in bright lunar conditions causing the thin crosses to be washed out by bright objects.",
                proponent: "Bill Kaysing, Ralph Rene",
                year: "1976"
            },
            {
                id: "LUNA-002",
                category: "Photographic",
                severity: "High",
                claim: "Shadows converge at different angles, proving multiple light sources (studio lights)",
                evidence: "AS11-40-5931, AS14-68-9486",
                counter: "Terrain undulations cause apparent angle changes; single source (sun)",
                status: "Debunked",
                details: "Multiple light sources would create diverging shadows. In photos, shadows appear to converge at different angles, suggesting studio lighting. Photography experts explain that uneven terrain creates this illusion - shadows on slopes appear at different angles relative to the camera.",
                proponent: "David Percy, Marcus Allen",
                year: "1997"
            },
            {
                id: "LUNA-003",
                category: "Photographic",
                severity: "Medium",
                claim: "No stars visible in any lunar surface photographs",
                evidence: "All EVA photos",
                counter: "Exposure settings too fast to capture dim stars against bright lunar surface",
                status: "Debunked",
                details: "Stars are dim and require long exposure times. The lunar surface is bright and requires fast shutter speeds (1/250 to 1/500 sec). Camera settings were optimized for the bright surface, not stars. Astronauts reported seeing stars visually.",
                proponent: "Various",
                year: "1969"
            },
            {
                id: "LUNA-004",
                category: "Photographic",
                severity: "Medium",
                claim: "Identical background hills in photos taken miles apart suggest backdrop",
                evidence: "Apollo 16 EVA photos 1.6 miles apart",
                counter: "Lunar terrain scale is deceptive; hills are miles distant",
                status: "Debunked",
                details: "Photos taken at different locations show identical hill profiles, suggesting a backdrop. However, on the moon with no atmospheric haze, distant objects appear closer. The hills were actually 3-5 miles away and miles high.",
                proponent: "Bart Sibrel",
                year: "2001"
            },
            {
                id: "LUNA-005",
                category: "Photographic",
                severity: "Medium",
                claim: "C-rock visible in photo proves stage prop labeling",
                evidence: "AS16-107-17446",
                counter: "Hair or fiber on film during development; object not in original negative",
                status: "Debunked",
                details: "A photo appears to show a rock labeled 'C' suggesting a stage prop. The 'C' is not present in the original transparency and appears to be a hair or fiber on a later print. The same photo without the C exists in archives.",
                proponent: "Bart Sibrel",
                year: "2001"
            },
            {
                id: "LUNA-006",
                category: "Photographic",
                severity: "High",
                claim: "Studio lights visible in astronaut helmet reflections",
                evidence: "AS11-40-5924 (Buzz Aldrin helmet)",
                counter: "LEM structure, equipment, and other astronaut reflected",
                status: "Debunked",
                details: "Helmet reflections show geometric shapes interpreted as studio lights. Analysis shows these are the LEM structure, the photographer (Armstrong), and equipment. The 'light' is the sun's reflection on the LEM.",
                proponent: "Bart Sibrel",
                year: "2001"
            },
            {
                id: "LUNA-007",
                category: "Photographic",
                severity: "Medium",
                claim: "Multiple light sources on astronaut's suit (front and back lit simultaneously)",
                evidence: "AS11-40-5875 (Aldrin descending ladder)",
                counter: "Ground reflection, LEM reflection, sun from behind camera",
                status: "Debunked",
                details: "Aldrin appears front-lit while in shadow of LEM. Conspiracists claim this requires fill lights. However, the lunar surface reflects sunlight effectively, acting as a fill light. The suit's reflective material also catches ambient light.",
                proponent: "David Percy",
                year: "1997"
            },
            {
                id: "LUNA-008",
                category: "Photographic",
                severity: "Medium",
                claim: "Wire harness visible on astronaut's back in slow-motion footage",
                evidence: "Apollo 16 jump footage",
                counter: "Life support backpack, portable life support system (PLSS)",
                status: "Debunked",
                details: "Wires appear to assist astronauts in jumping in reduced gravity. These are the Portable Life Support System (PLSS) backpack straps and antennas. The PLSS weighed 180 lbs on Earth but only 30 lbs on the moon.",
                proponent: "Various",
                year: "2000s"
            },
            {
                id: "LUNA-009",
                category: "Photographic",
                severity: "Low",
                claim: "Same mountain backdrop used in Apollo 15, 16, and 17",
                evidence: "Comparative panorama analysis",
                counter: "Different mountains; similar lighting conditions create similar appearances",
                status: "Debunked",
                details: "Analysis claims the same 'painted' backdrop was used for multiple missions. Geographic features are distinct upon close inspection. The lack of atmospheric perspective makes distant objects look similar across locations.",
                proponent: "Various",
                year: "2000s"
            },
            {
                id: "LUNA-010",
                category: "Photographic",
                severity: "High",
                claim: "Studio spotlights reflected in Gene Cernan's helmet visor (Apollo 17)",
                evidence: "AS17-134-20384",
                counter: "LEM structure and equipment reflection",
                status: "Debunked",
                details: "The final Apollo 17 photo shows a rectangular reflection in the visor interpreted as a studio light. Analysis identifies this as the reflection of the LEM's forward equipment bay and antenna arrays.",
                proponent: "Various",
                year: "2010s"
            },
            {
                id: "LUNA-011",
                category: "Photographic",
                severity: "Medium",
                claim: "Objects appear translucent in photos (double exposure evidence)",
                evidence: "LEM appears see-through in some images",
                counter: "Film processing defects, overexposure",
                status: "Debunked",
                details: "Some photos show the LEM or astronauts with translucent edges, suggesting double exposure compositing. Photo experts identify these as film processing defects, light leaks, or overexposure during development.",
                proponent: "Various",
                year: "1990s"
            },
            {
                id: "LUNA-012",
                category: "Photographic",
                severity: "Medium",
                claim: "Lettering visible on 'rocks' proves props",
                evidence: "AS15-87-11839",
                counter: " pareidolia; natural mineral formations",
                status: "Debunked",
                details: "Photos appear to show letters like 'C' or 'S' on rocks, interpreted as prop markings. Geologists identify these as natural mineral veins and fracture patterns in anorthosite rock that resemble lettering.",
                proponent: "YouTube analysts",
                year: "2015"
            },
            {
                id: "LUNA-013",
                category: "Photographic",
                severity: "High",
                claim: "Slow-motion photography used to simulate 1/6 gravity",
                evidence: "50% speed analysis shows Earth gravity motion",
                counter: "Increased stride length, dust hang time proves reduced gravity",
                status: "Debunked",
                details: "Video analysis claims footage was filmed at 2x speed then played slow to simulate low gravity. However, dust kicked up hangs in the air longer than Earth gravity allows, and stride length calculations confirm 1/6 g.",
                proponent: "Various",
                year: "2000s"
            },
            {
                id: "LUNA-014",
                category: "Photographic",
                severity: "Medium",
                claim: "Scotch tape visible holding down cables on 'moon set'",
                evidence: "Apollo 17 footage",
                counter: "Foil tape used on equipment, not scotch tape",
                status: "Misidentified",
                details: "Silver tape visible on equipment is claimed to be scotch tape. This is actually metallic foil tape used for thermal management and securing cables, consistent with space mission equipment.",
                proponent: "Social media",
                year: "2020"
            },
            {
                id: "LUNA-015",
                category: "Photographic",
                severity: "Low",
                claim: "Camera crosshairs rotated between photos proving composite images",
                evidence: "Crosshair alignment comparison",
                counter: "Cameras were rotated between shots; crosshairs fixed to lens",
                status: "Debunked",
                details: "Crosshairs appear at different angles in different photos, suggesting multiple images composited. The Hasselblad cameras were handheld and rotated between shots; the crosshairs are fixed to the lens and rotate with the camera body.",
                proponent: "Various",
                year: "1990s"
            },
            {
                id: "LUNA-016",
                category: "Photographic",
                severity: "High",
                claim: "Earth photos show identical cloud patterns hours apart",
                evidence: "AS11-44-6547 vs AS11-44-6551",
                counter: "Time stamps show 2-hour difference; Earth rotates slowly from moon",
                status: "Debunked",
                details: "Photos of Earth taken hours apart show nearly identical cloud formations. From the moon, Earth appears nearly stationary and rotates slowly (one rotation per month from lunar perspective). 2 hours is minimal change.",
                proponent: "Conspiracy forums",
                year: "2000s"
            },
            {
                id: "LUNA-017",
                category: "Photographic",
                severity: "Medium",
                claim: "Lack of exhaust flame from LEM ascent stage proves fake",
                evidence: "Apollo 11 liftoff footage",
                counter: "Rocket exhaust is transparent in vacuum; no atmosphere to glow",
                counter: "Fuel (Aerozine 50) produces clear exhaust in vacuum",
                status: "Debunked",
                details: "The LEM ascent shows no visible exhaust flame. In Earth's atmosphere, exhaust glows due to combustion with air. In vacuum, rocket exhaust expands immediately and is transparent. The fuel combination also burns relatively clear.",
                proponent: "Bart Sibrel",
                year: "2001"
            },
            {
                id: "LUNA-018",
                category: "Photographic",
                severity: "Low",
                claim: "Astronauts visible in shadow without helmet lights despite darkness",
                evidence: "Shadow photography during EVA",
                counter: "Surface reflection, long exposure photography",
                status: "Debunked",
                details: "Astronauts in shadow are clearly visible without helmet lights. The lunar surface reflects approximately 12% of sunlight, providing significant fill light in shadowed areas. Long exposures also capture more light.",
                proponent: "Various",
                year: "1970s"
            },
            {
                id: "LUNA-019",
                category: "Photographic",
                severity: "Medium",
                claim: "Props visible in background including cardboard cutouts",
                evidence: "Apollo 15 photos",
                counter: "Photographic anomalies, pareidolia",
                status: "Debunked",
                details: "Claims of cardboard cutouts and props visible in the background of lunar photos. These are typically photographic processing defects, lens flare, or pareidolia (seeing patterns in random data).",
                proponent: "YouTube channels",
                year: "2010s"
            },
            {
                id: "LUNA-020",
                category: "Photographic",
                severity: "High",
                claim: "Lunar module appears to be made of paper, tape, and foil",
                evidence: "Close-up photos of LM exterior",
                counter: "Mylar thermal blankets, Kapton tape, lightweight construction required for mass ratios",
                status: "Misunderstood",
                details: "The LM exterior appears to be covered in gold foil and tape, looking 'fake.' This is Mylar thermal insulation and Kapton tape, necessary for thermal management. The LM was built extremely lightweight (skin thickness 0.012 inches in places) to save weight.",
                proponent: "First-time observers",
                year: "1969"
            },

            // TECHNICAL IMPOSSIBILITIES (21-60)
            {
                id: "LUNA-021",
                category: "Technical",
                severity: "High",
                claim: "Van Allen radiation belts would have fried the astronauts with 100+ rads/hour",
                evidence: "Van Allen belt measurements, SPE radiation events",
                counter: "Traversed belts quickly (1 hour total), spacecraft shielding sufficient for short duration",
                status: "Contested",
                details: "The Van Allen belts contain high concentrations of energetic particles. Skeptics argue the radiation dosage would have been lethal or at least caused severe health effects. NASA claims the trajectory was calculated to minimize exposure and the aluminum hull provided sufficient protection for the short transit time.",
                proponent: "Bart Sibrel, Bill Kaysing",
                year: "1970"
            },
            {
                id: "LUNA-022",
                category: "Technical",
                severity: "High",
                claim: "LEM engine was silent in audio recordings despite 10,000 lb thrust",
                evidence: "Apollo 11 landing audio",
                counter: "Microphones inside pressure suits, engine sound doesn't transmit through vacuum",
                status: "Debunked",
                details: "The descent engine should have produced deafening noise. Audio recordings show only radio chatter. Sound requires a medium (air) to travel; the vacuum of space cannot transmit sound waves. Astronauts were also isolated in pressurized suits.",
                proponent: "Bart Sibrel",
                year: "2001"
            },
            {
                id: "LUNA-023",
                category: "Technical",
                severity: "High",
                claim: "Technology in 1969 insufficient for computer guidance (less power than calculator)",
                evidence: "AGC specs: 74KB memory, 1MHz processor",

        function init() {
            renderTable();

        function renderTable() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            
            const start = (currentPage - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            const pageItems = filteredTheories.slice(start, end);

            pageItems.forEach(theory => {
                const row = document.createElement('tr');
                if (theory.status === 'Debunked' && !showDebunked) {
                    row.className = 'debunked';
                    row.style.display = 'none';
                }
                row.onclick = () => toggleExpand(theory.id);
                
                row.innerHTML = `
                    <td class="theory-id">${theory.id}</td>
                    <td><span class="category cat-${theory.category.toLowerCase()}">${theory.category}</span></td>
                    <td><span class="severity sev-${theory.severity.toLowerCase()}"></span>${theory.severity}</td>
                    <td class="claim-text">${theory.claim}</td>
                    <td>${theory.evidence}</td>
                    <td>${theory.counter}</td>
                    <td>${theory.status}</td>
                `;
                
                tbody.appendChild(row);
                
                const detailRow = document.createElement('tr');
                detailRow.id = `detail-${theory.id}`;
                detailRow.className = 'expanded-row';
                detailRow.innerHTML = `
                    <td colspan="7">
                        <div class="expanded-content">
                            <div class="detail-section">
                                <span class="detail-label">Detailed Analysis</span>
                                <div class="detail-text">${theory.details}</div>
                            </div>
                            <div class="detail-section">
                                <span class="detail-label">Primary Proponent</span>
                                <div class="detail-text">${theory.proponent} (${theory.year})</div>
                            </div>
                            <div class="detail-section">
                                <span class="detail-label">Classification</span>
                                <div class="detail-text">
                                    <span class="evidence-tag">CONFIDENTIAL</span>
                                    <span class="evidence-tag">EYES ONLY</span>
                                    <span class="redacted">[REDACTED]</span>
                                </div>
                            </div>
                        </div>
                    </td>
                `;
                tbody.appendChild(detailRow);
            });

            document.getElementById('currentPage').textContent = currentPage;
            document.getElementById('totalPages').textContent = Math.ceil(filteredTheories.length / itemsPerPage);
        }

        function toggleExpand(id) {
            const detail = document.getElementById(`detail-${id}`);
            detail.style.display = detail.style.display === 'table-row' ? 'none' : 'table-row';
        }

        function filterTable() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const category = document.getElementById('categoryFilter').value;
            const severity = document.getElementById('severityFilter').value;

            filteredTheories = theories.filter(t => {
                const matchesSearch = t.claim.toLowerCase().includes(search) || 
                                    t.id.toLowerCase().includes(search) ||
                                    t.evidence.toLowerCase().includes(search);
                const matchesCategory = !category || t.category === category;
                const matchesSeverity = !severity || t.severity === severity;
                
                return matchesSearch && matchesCategory && matchesSeverity;
            });

            currentPage = 1;
            renderTable();
            updateStats();
        }

        function sortTable(column) {
            if (sortColumn === column) {
                sortDirection *= -1;
            } else {
                sortColumn = column;
                sortDirection = 1;
            }

            const keys = ['id', 'category', 'severity', 'claim', 'evidence', 'counter', 'status'];
            const key = keys[column];

            filteredTheories.sort((a, b) => {
                if (a[key] < b[key]) return -1 * sortDirection;
                if (a[key] > b[key]) return 1 * sortDirection;
                return 0;
            });

            renderTable();
        }

        function toggleDebunked() {
            showDebunked = !showDebunked;
            renderTable();
        }

        function updateStats() {
            document.getElementById('totalTheories').textContent = filteredTheories.length;
            document.getElementById('technicalCount').textContent = 
                filteredTheories.filter(t => t.category === 'Technical').length;
            document.getElementById('photoCount').textContent = 
                filteredTheories.filter(t => t.category === 'Photographic').length;
            document.getElementById('highSeverity').textContent = 
                filteredTheories.filter(t => t.severity === 'High').length;
        }

        function exportCSV() {
            let csv = 'ID,Category,Severity,Claim,Evidence,Counter,Status,Proponent,Year\n';
            filteredTheories.forEach(t => {
                csv += `"${t.id}","${t.category}","${t.severity}","${t.claim}","${t.evidence}","${t.counter}","${t.status}","${t.proponent}","${t.year}"\n`;
            });
            
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'project_luna_database.csv';
            a.click();
        }

        function nextPage() {
            const totalPages = Math.ceil(filteredTheories.length / itemsPerPage);
            if (currentPage < totalPages) {
                currentPage++;
                renderTable();
            }
        }

        function prevPage() {
            if (currentPage > 1) {
                currentPage--;
                renderTable();
            }
        }

        document.getElementById('searchInput').addEventListener('input', filterTable);
        document.getElementById('categoryFilter').addEventListener('change', filterTable);
        document.getElementById('severityFilter').addEventListener('change', filterTable);

        init();
    </script>
